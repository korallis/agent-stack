# The test suite on every pull request and on main: the exact-head check the merge gate reads.
# No secrets and no billed services: Jev is stubbed in the tests (AGENT_JEV_STUB), gh/rig/tmux are stubs, and every
# test runs in a throwaway HOME. Tests that need the owner's machine (install.sh's prerequisites, OpenRig, rig, codex)
# skip with their reason.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    # Local runner when CI_LOCAL=1 (agent-ci-runner, docs/RUNNERS.md) and the PR isn't from a fork; hosted otherwise.
    runs-on: ${{ (vars.CI_LOCAL == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","korallis-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: jev/package-lock.json
      # actions/setup-python has no builds for the local runner's Arch Linux: there, the host's own python3 (with
      # pyyaml) is used, as in agent-heavy runs on this machine.
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          npm ci --prefix jev --no-audit --no-fund
          npm install -g @toon-format/cli@4.1.1 --no-audit --no-fund
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then python -m pip install --quiet pyyaml
          else python3 -c 'import yaml' || { echo "::error::the local runner host needs python3 with pyyaml"; exit 1; }; fi
      - name: Test
        run: node --test 'test/*.test.js'
