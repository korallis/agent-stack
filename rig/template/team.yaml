# Balanced 24-seat team: 12 Claude Code + 12 Codex.
# Copy to <workspace>/rig/, replace @RIG@ (rig name, e.g. hc), @REPO@ (absolute repo path) and
# @WT@ (absolute worktrees folder, e.g. <repo>.worktrees), create the worktrees with git, then:
#   rig spec validate <file>  →  rig up <file>   (later: rig down @RIG@ --snapshot / rig up @RIG@)
# Roles come from the shared template (path: refs), so improving a role improves every repo's rig.
version: "0.2"
name: "@RIG@"
summary: "Balanced 12 Claude + 12 Codex team"
culture_file: CULTURE.md
# Seats launch with permission checks off.
permission_policy: builtin:yolo
managed_blocks:
  claude-code: CLAUDE.local.md

workspace:
  workspace_root: "@REPO@"
  repos:
    - name: "@RIG@"
      path: .
      kind: project
  default_repo: "@RIG@"

pods:
  - id: coord
    label: "Coordination"
    members:
      - id: lead-claude
        agent_ref: "path:/home/lee/Projects/agent-stack/rig/template/agents/lead"
        profile: default
        runtime: claude-code
        model: claude-opus-5-5
        cwd: "@WT@/coord-lead-claude"
        restore_policy: resume_if_possible
      - id: deputy-codex
        agent_ref: "path:/home/lee/Projects/agent-stack/rig/template/agents/deputy"
        profile: default
        runtime: codex
        model: gpt-6-sol
        cwd: "@WT@/coord-deputy-codex"
        restore_policy: resume_if_possible
    edges:
      - kind: delegates_to
        from: lead-claude
        to: deputy-codex
      - kind: escalates_to
        from: deputy-codex
        to: lead-claude

  - id: arch
    label: "Architecture & planning"
    members:
      - id: claude
        agent_ref: "path:/home/lee/Projects/agent-stack/rig/template/agents/architect"
