  - id: review
    label: "Independent review: Opus reviews Codex PRs, Sol reviews Claude PRs, Kimi third family and long-context"
    members:
      - id: claude-1
        agent_ref: "path:@AGENT_STACK@/rig/template/agents/reviewer"
        profile: default
        runtime: claude-code
        model: "claude-opus-5-5"
