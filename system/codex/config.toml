# Managed by agent-stack (backup + rollback: ~/Projects/agent-stack/docs/ROLLBACK.md).
# Codex -> local CLIProxyAPI pool (4 ChatGPT Pro accounts). Upstream credentials stay in the proxy.
model_provider = "cliproxyapi"
model = "gpt-6-astra"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[model_providers.cliproxyapi]
name = "CLIProxyAPI (local pool)"
base_url = "http://127.0.0.1:8317/v1"
wire_api = "responses"
requires_openai_auth = false
supports_websockets = true
model_catalog_url = "http://127.0.0.1:8317/v1/models"
request_max_retries = 4
stream_max_retries = 5
stream_idle_timeout_ms = 300000

[model_providers.cliproxyapi.auth]
command = "/home/lee/.local/share/agent-stack/bin/cliproxy-key"
timeout_ms = 5000
refresh_interval_ms = 3600000

# OpenRig submits pasted messages with C-m. With tmux extended-keys (csi-u, Omarchy default) Codex
# receives that as Ctrl+M, which by default inserts a newline, so rig messages never submitted.
# Make Ctrl+M submit (Enter unchanged); newline stays on Shift+Enter / Ctrl+J / Alt+Enter.
[tui.keymap.composer]
submit = ["enter", "ctrl-m"]

[tui.keymap.editor]
insert_newline = ["shift-enter", "ctrl-j", "alt-enter"]

[mcp_servers.jev]
command = "/home/lee/.local/bin/jev-mcp"
# Jev decisions are advisory and read-only; pre-approve so non-interactive/rig Codex seats can call them.
default_tools_approval_mode = "approve"

[features]
hooks = true

# BEGIN OPENRIG MANAGED ACTIVITY HOOKS
[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = 'node "/home/lee/.local/share/agent-stack/openrig/lib/node_modules/@openrig/cli/daemon/assets/plugins/openrig-core/hooks/scripts/activity-relay.cjs"'
timeout = 5

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = 'node "/home/lee/.local/share/agent-stack/openrig/lib/node_modules/@openrig/cli/daemon/assets/plugins/openrig-core/hooks/scripts/activity-relay.cjs"'
timeout = 5

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = 'node "/home/lee/.local/share/agent-stack/openrig/lib/node_modules/@openrig/cli/daemon/assets/plugins/openrig-core/hooks/scripts/activity-relay.cjs"'
timeout = 5

[[hooks.PermissionRequest]]
[[hooks.PermissionRequest.hooks]]
type = "command"
command = 'node "/home/lee/.local/share/agent-stack/openrig/lib/node_modules/@openrig/cli/daemon/assets/plugins/openrig-core/hooks/scripts/activity-relay.cjs"'
timeout = 5
# END OPENRIG MANAGED ACTIVITY HOOKS

