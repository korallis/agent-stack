name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  guards:
    name: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: protected-paths (locked acceptance tests)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bash scripts/guards/check-protected-paths.sh
      - name: human-perspective (journeys test like a person)
        run: bash scripts/guards/check-human-perspective.sh

  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run --if-present lint
      - run: npm run --if-present typecheck
      - run: npm run --if-present test

  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    needs: [guards]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # tests/* PRs add journeys for features that don't exist yet: they must compile, and are expected to fail.
      - name: journeys compile (test-author PRs)
        if: startsWith(github.head_ref, 'tests/')
        run: npx playwright test --list
      - name: journeys pass (everything else)
        if: ${{ !startsWith(github.head_ref, 'tests/') }}
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
